
<section id="simulacao">

    <div class="section-heading">
        <h2>Simulação de custos</h2>
        <p>Calcule automaticamente a distância e o custo da viagem</p>
    </div>

    <div class="panel">
        <h3>Simulador inteligente de transporte</h3>

        <div class="simulation-grid">

            <div>
                <label for="origem">Local de partida</label>
                <input type="text" id="origem"
                    placeholder="Obtendo localização...">
                <button type="button" id="usarLocalizacao">
                    Usar minha localização
                </button>
            </div>

            <div>
                <label for="destino">Destino</label>
                <input type="text" id="destino"
                    placeholder="Digite a cidade ou endereço">
            </div>

            <div>
                <label for="tipoPercurso">Tipo de percurso</label>
                <select id="tipoPercurso">
                    <option value="ida">Somente ida</option>
                    <option value="ida_volta">Ida e volta</option>
                    <option value="personalizado">Retorno personalizado</option>
                </select>
            </div>

            <div id="campoRetorno" style="display: none;">
                <label for="destinoRetorno">Destino do retorno</label>
                <input type="text" id="destinoRetorno"
                    placeholder="Digite o destino do retorno">
            </div>

            <div>
                <label for="veiculo">Tipo de veículo</label>
                <select id="veiculo">
                    <option value="caminhao">Caminhão</option>
                    <option value="carreta">Carreta</option>
                    <option value="bitrem">Bitrem</option>
                    <option value="outro">Outro</option>
                </select>
            </div>

            <div>
                <label for="consumo">Consumo médio (km/L)</label>
                <input type="number" id="consumo"
                    placeholder="Ex: 2.5" min="0.1" step="0.1">
            </div>

            <div>
                <label for="diesel">Preço do diesel (R$/L)</label>
                <input type="number" id="diesel"
                    placeholder="Ex: 6.20" min="0.01" step="0.01">
            </div>

        </div>

        <button type="button" id="calcularSimulacao">
            Calcular custo da viagem
        </button>

        <div id="resultadoSimulacao">
            Informe o destino e os dados do veículo.
        </div>

    </div>

</section>
