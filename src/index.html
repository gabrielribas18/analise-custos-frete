
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Análise de Custos de Frete</title>

    <link rel="stylesheet" href="src/style.css">
</head>
<body>

    <header>
        <h1>Análise de Custos de Frete</h1>
        <p>Agrária | Painel de análise e simulação</p>
    </header>

    <main>
        <section class="indicadores">
            <h2>Indicadores gerais</h2>

            <div class="cards">
                <div class="card">
                    <h3>Total de fretes</h3>
                    <p id="totalFretes">0</p>
                </div>

                <div class="card">
                    <h3>Custo total</h3>
                    <p id="custoTotal">R$ 0,00</p>
                </div>

                <div class="card">
                    <h3>Custo médio</h3>
                    <p id="custoMedio">R$ 0,00</p>
                </div>

                <div class="card">
                    <h3>Distância total</h3>
                    <p id="distanciaTotal">0 km</p>
                </div>
            </div>
        </section>

        <section>
            <h2>Análise de fretes</h2>
            <div id="analiseFretes">
                Aguardando carregamento dos dados...
            </div>
        </section>

        <section>
            <h2>Simulação de custos</h2>
            <div id="simulacao">
                Área de simulação em desenvolvimento.
            </div>
        </section>
    </main>

    <script src="src/script.js"></script>

</body>
</html>
